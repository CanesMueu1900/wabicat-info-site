<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="公开的信息与资讯更新。"><title>信息站 · Wabicat</title>
<style>
:root{color-scheme:dark;--ink:#e7edf5;--muted:#a5b2c2;--line:#334155;--paper:#0b1220;--surface:#121d2e;--blue:#8fc5ff;--mint:#183f43;--focus:#78b7ff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}header{background:linear-gradient(125deg,#101b2b,#172c47 62%,#174047);color:#f8fbff;padding:48px 22px 40px;border-bottom:1px solid #334155}.wrap{max-width:900px;margin:auto}header .eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:#a8c6df}h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.1;margin:.45rem 0}.subtitle{max-width:650px;color:#d0dbea;margin:14px 0 0}main{max-width:900px;margin:30px auto;padding:0 22px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.toolbar input{flex:1;min-width:220px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;background:#101a29;color:var(--ink)}.toolbar input::placeholder{color:#91a0b3}.toolbar input:focus{outline:2px solid var(--focus);outline-offset:2px}.count{color:var(--muted);font-size:.9rem}#items{display:grid;gap:16px}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 8px 24px #0005}.meta{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:.83rem}.tag{background:var(--mint);color:#b5f0df;border:1px solid #28645d;border-radius:100px;padding:2px 10px}.card h2{font-size:1.28rem;line-height:1.35;margin:12px 0 6px;color:#f2f6fc}.summary{font-weight:600;margin:0 0 10px;color:#dbe5f1}.body{white-space:pre-wrap;color:#c2cddd;margin:0}.source{display:inline-block;margin-top:14px;color:var(--blue);font-weight:650;text-decoration:none}.source:hover{text-decoration:underline;color:#b8dcff}.empty,.error{background:var(--surface);border:1px dashed #53647a;border-radius:14px;padding:26px;color:var(--muted);text-align:center}.error{color:#ffaaa9}.foot{color:var(--muted);font-size:.83rem;margin:34px 0 24px;text-align:center}a{overflow-wrap:anywhere}a:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:3px}@media(max-width:560px){header{padding:36px 20px}main{padding:0 14px}.card{padding:18px}}
</style></head><body><header><div class="wrap"><div class="eyebrow">WABICAT · 信息与发现</div><h1>信息站</h1><p class="subtitle">把值得留意的新闻、旅行灵感和实用信息，整理在一个清爽易读的地方。</p></div></header><main><div class="toolbar"><input id="search" type="search" placeholder="搜索标题、摘要或正文…" aria-label="搜索信息"><span id="count" class="count"></span></div><section id="items" aria-live="polite"><div class="empty">正在载入…</div></section><p class="foot">内容通过公开 JSON API 更新 · <a href="/api/items">查看 API 数据</a></p></main>
<script>
const list=document.querySelector('#items'),search=document.querySelector('#search'),count=document.querySelector('#count');let all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=search.value.trim().toLocaleLowerCase(),rows=all.filter(x=>[x.title,x.summary,x.body,x.category].some(v=>String(v||'').toLocaleLowerCase().includes(q)));count.textContent=rows.length+' 条信息';if(!rows.length){list.innerHTML='<div class="empty">'+(all.length?'没有匹配的内容。':'这里还没有发布内容，之后的资讯会显示在这里。')+'</div>';return}list.innerHTML=rows.map(x=>'<article class="card"><div class="meta"><span class="tag">'+esc(x.category||'资讯')+'</span><time>'+esc(new Date(x.publishedAt).toLocaleString('zh-CN',{dateStyle:'medium',timeStyle:'short'}))+'</time></div><h2>'+esc(x.title)+'</h2>'+(x.summary?'<p class="summary">'+esc(x.summary)+'</p>':'')+(x.body?'<p class="body">'+esc(x.body)+'</p>':'')+(x.sourceUrl?'<a class="source" href="'+esc(x.sourceUrl)+'" target="_blank" rel="noopener noreferrer">阅读来源 ↗</a>':'')+'</article>').join('')}search.addEventListener('input',render);fetch('/api/items').then(r=>{if(!r.ok)throw Error('载入失败');return r.json()}).then(d=>{all=Array.isArray(d.items)?d.items:[];render()}).catch(()=>{list.innerHTML='<div class="error">暂时无法载入信息，请稍后再试。</div>'});
</script></body></html>
